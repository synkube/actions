name: ArgoCD diff detect
description: Map changed workload files to co-located Application manifest paths.

inputs:
  changed_files:
    description: Space-separated list of changed file paths.
    required: true
  apps_path:
    description: Application manifests directory.
    required: false
    default: apps
  workloads_path:
    description: Helm values directory.
    required: false
    default: workloads
  charts_path:
    description: Local charts directory.
    required: false
    default: charts

outputs:
  has_changes:
    description: Whether any applications are affected.
    value: ${{ steps.detect.outputs.has_changes }}
  matrix:
    description: JSON matrix for affected applications.
    value: ${{ steps.detect.outputs.matrix }}
  changed_files_by_app:
    description: JSON map of changed files per app key.
    value: ${{ steps.detect.outputs.changed_files_by_app }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        CHANGED_FILES: ${{ inputs.changed_files }}
        APPS_PATH: ${{ inputs.apps_path }}
        WORKLOADS_PATH: ${{ inputs.workloads_path }}
        CHARTS_PATH: ${{ inputs.charts_path }}
        LAYOUT: auto
      run: bash "${GITHUB_ACTION_PATH}/detect.sh"
