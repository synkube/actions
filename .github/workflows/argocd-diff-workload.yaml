# Reusable ArgoCD diff preview for co-located workload repos (apps/ + charts/ + workloads/).
#
# Caller: pull-requests on apps/**, charts/**, workloads/**. Pass actions_ref as the
# same commit SHA as this workflow pin so scripts resolve from synkube/actions.
#
# Secrets:
#   ARGOCD_DIFF_PAT (optional) — PAT with repo read; falls back to GITHUB_TOKEN.

name: ArgoCD diff (workload)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      actions_ref:
        description: Commit SHA of synkube/actions (same as the uses: pin).
        type: string
        required: true
      layout:
        description: auto | single | multi — how to map charts/workloads paths to apps/.
        type: string
        required: false
        default: auto
      apps_path:
        description: Path to Application manifests.
        type: string
        required: false
        default: apps
      workloads_path:
        description: Path to Helm value files.
        type: string
        required: false
        default: workloads
      charts_path:
        description: Path to local wrapper charts.
        type: string
        required: false
        default: charts
      argocd_diff_version:
        description: dagandersen/argocd-diff-preview image tag.
        type: string
        required: false
        default: v0.1.22
      argocd_diff_digest:
        description: Image digest for argocd-diff-preview.
        type: string
        required: false
        default: sha256:c1d5f605f945d97cdb0845751d780cba3c39dab9071499972245e8f481795189
    secrets:
      ARGOCD_DIFF_PAT:
        description: Optional PAT for private Helm/Git dependencies.
        required: false

env:
  ARGOCD_DIFF_VERSION: ${{ inputs.argocd_diff_version }}
  ARGOCD_DIFF_DIGEST: ${{ inputs.argocd_diff_digest }}

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      matrix: ${{ steps.detect.outputs.matrix }}
      changed_files_by_app: ${{ steps.detect.outputs.changed_files_by_app }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            ${{ inputs.apps_path }}/**
            ${{ inputs.workloads_path }}/**
            ${{ inputs.charts_path }}/**

      - name: Checkout synkube/actions scripts
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: synkube/actions
          ref: ${{ inputs.actions_ref }}
          path: _synkube_actions
          sparse-checkout: |
            .github/scripts/argocd-diff-workload
          sparse-checkout-cone-mode: true

      - name: Detect affected applications
        id: detect
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          APPS_PATH: ${{ inputs.apps_path }}
          WORKLOADS_PATH: ${{ inputs.workloads_path }}
          CHARTS_PATH: ${{ inputs.charts_path }}
          LAYOUT: ${{ inputs.layout }}
        run: |
          set -euo pipefail
          if [ "${{ steps.changed-files.outputs.any_changed }}" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'changed_files_by_app={}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash _synkube_actions/.github/scripts/argocd-diff-workload/detect.sh

  argocd-diff:
    name: Diff - ${{ matrix.app_key }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: target-branch

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-branch

      - name: Checkout synkube/actions scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: synkube/actions
          ref: ${{ inputs.actions_ref }}
          path: _synkube_actions
          sparse-checkout: |
            .github/scripts/argocd-diff-workload
          sparse-checkout-cone-mode: true

      - name: Setup application manifests
        env:
          APP_PATH: ${{ matrix.app_path }}
          APP_KEY: ${{ matrix.app_key }}
          TARGET_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_FULL_NAME: ${{ github.repository }}
          CHANGED_FILES_BY_APP: ${{ needs.detect-changes.outputs.changed_files_by_app }}
        run: bash _synkube_actions/.github/scripts/argocd-diff-workload/setup-manifests.sh

      - name: Prepare credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGOCD_DIFF_PAT: ${{ secrets.ARGOCD_DIFF_PAT }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          TOKEN="${ARGOCD_DIFF_PAT:-$GITHUB_TOKEN}"

          cat > secrets/repo-creds.yaml << EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-creds-github
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          stringData:
            url: https://github.com/${{ github.repository }}
            password: ${TOKEN}
            username: x-access-token
          EOF

          cat > secrets/ghcr-creds.yaml << EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-helm-creds
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            name: ghcr-helm
            type: helm
            url: ghcr.io/${{ github.repository_owner }}
            username: x-access-token
            password: ${GITHUB_TOKEN}
            enableOCI: "true"
          EOF

      - name: Cache ArgoCD Diff image
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/docker-images
          key: docker-argocd-diff-preview-${{ env.ARGOCD_DIFF_VERSION }}-${{ env.ARGOCD_DIFF_DIGEST }}

      - name: Load or pull image
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          if [ -f /tmp/docker-images/argocd-diff-preview.tar ]; then
            docker load -i /tmp/docker-images/argocd-diff-preview.tar
          else
            docker pull "dagandersen/argocd-diff-preview:${{ env.ARGOCD_DIFF_VERSION }}@${{ env.ARGOCD_DIFF_DIGEST }}"
            docker save "dagandersen/argocd-diff-preview:${{ env.ARGOCD_DIFF_VERSION }}@${{ env.ARGOCD_DIFF_DIGEST }}" -o /tmp/docker-images/argocd-diff-preview.tar
          fi

      - name: Run ArgoCD Diff Preview
        env:
          APP_KEY: ${{ matrix.app_key }}
        run: |
          set +e
          mkdir -p output
          DOCKER_LOG="/tmp/docker-run.log"
          touch "$DOCKER_LOG"

          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/base-branch:/base-branch" \
            -v "$(pwd)/target-branch:/target-branch" \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/secrets:/secrets" \
            -e TARGET_BRANCH="${{ github.head_ref }}" \
            -e REPO="${{ github.repository }}" \
            -e FILE_REGEX="applications/.*\\.yaml" \
            "dagandersen/argocd-diff-preview:${{ env.ARGOCD_DIFF_VERSION }}@${{ env.ARGOCD_DIFF_DIGEST }}" 2>&1 | tee "$DOCKER_LOG"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            {
              echo "## ⚠️ Diff preview failed"
              echo ""
              echo "Exit code: ${EXIT_CODE}"
              echo ""
              echo "<details><summary>Error logs</summary>"
              echo ""
              echo '```'
              if [ -s "$DOCKER_LOG" ]; then
                tail -100 "$DOCKER_LOG"
              else
                echo "No logs captured."
              fi
              echo '```'
              echo "</details>"
            } > output/diff.md
          fi

          if [ -f output/diff.md ]; then
            { echo "## 🔍 ArgoCD diff: \`${APP_KEY}\`"; echo ""; cat output/diff.md; } > output/final.md
            mv output/final.md output/diff.md
          else
            echo "## ✅ No manifest changes for \`${APP_KEY}\`" > output/diff.md
          fi

          head -c 900000 output/diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post diff comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_KEY: ${{ matrix.app_key }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- argocd-diff-workload:${process.env.APP_KEY} -->`;
            let diff = fs.readFileSync('output/diff.md', 'utf8');
            if (diff.length > 60000) {
              diff = diff.substring(0, 60000) + '\n\n---\n⚠️ **Truncated**';
            }
            const body = `${marker}\n${diff}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
